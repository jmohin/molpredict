name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # --locked fails rather than silently re-resolving, so CI tests what the lockfile pins.
        run: uv sync --locked

      - name: Check the CPU-only torch pin still holds
        # The CUDA build works but costs gigabytes; nothing here uses a GPU.
        run: uv run python -c "import torch; assert '+cpu' in torch.__version__, torch.__version__"

      - name: Run tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  container:
    # The deployable artifact. Building it here catches a broken image before it is pushed
    # anywhere, and the smoke test proves the frontend and API really are served together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: molpredict:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name mp -p 8080:8000 molpredict:ci
          # Loading the ADMET-AI ensembles takes several seconds.
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/api/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/api/health | grep '"models":3'
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -sf -X POST http://127.0.0.1:8080/api/predict \
            -H 'content-type: application/json' \
            -d '{"structure":"CC(=O)Oc1ccccc1C(=O)O"}' | grep -q 'Solubility_AqSolDB'

      - name: Container logs on failure
        if: failure()
        run: docker logs mp
