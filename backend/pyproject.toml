[project]
name = "molpredict-backend"
version = "0.1.0"
description = "Property predictions for a drawn molecule from published AI models"
authors = [
    { name = "jmohin", email = "jmohin@gmail.com" }
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "admet-ai>=2.0.1",
    "fastapi>=0.162.0",
    "rdkit>=2026.9.1",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
molpredict-backend = "molpredict_backend:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

# On Linux the default torch wheel drags in several GB of CUDA packages. Nothing here needs a
# GPU, so Linux (CI and the deployment container) takes the CPU-only build instead. macOS keeps
# the PyPI wheel, which is already CPU/MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Torch, Lightning and Chemprop are noisy on import; failures still surface.
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
